name: CI

# 部署到 Cloudflare 在本機跑 npm run deploy（見 README）；這裡只檢查型別和前端 build
on:
  push:
    branches: [main, cloudflare]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci
        working-directory: frontend
      - run: npm run check
